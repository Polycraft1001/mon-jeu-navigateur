<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Course 3D – Super Drift</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div>Tour <span id="lap">1/3</span></div>
    <div>Temps <span id="time">0:00.00</span></div>
    <div>Record <span id="best">--</span></div>
    <div>Drift <span id="dscore">0</span></div>
  </div>
  <div id="speed">0 <small>km/h</small></div>
  <div id="msg"></div>

  <div id="drift" class="hidden">
    <div id="driftTitle">DRIFT</div>
    <div id="driftPts">0</div>
    <div id="driftBar"><i></i></div>
  </div>

  <div id="help">Flèches / ZQSD : conduire · <b>Espace + virage : DRIFT</b> (relâche pour le turbo) · C : couleur · R : recommencer</div>

  <div id="touch">
    <div class="group">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
    <div class="group">
      <button data-k="hand" class="drift">DRIFT</button>
      <button data-k="down">▼</button>
      <button data-k="up">▲</button>
    </div>
  </div>

  <div id="end" class="hidden">
    <div class="box">
      <h2 id="endTitle">Arrivée !</h2>
      <div id="results"></div>
      <button id="restart">Rejouer</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
